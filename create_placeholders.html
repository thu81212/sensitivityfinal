<!DOCTYPE html>
<html>
<head>
    <title>Generate Placeholder Images</title>
</head>
<body>
    <h1>Generating placeholder images...</h1>
    <canvas id="loudCanvas" width="1920" height="1080"></canvas>
    <canvas id="quietCanvas" width="1920" height="1080"></canvas>
    <script>
        // Create Loud.png placeholder
        const loudCanvas = document.getElementById('loudCanvas');
        const loudCtx = loudCanvas.getContext('2d');
        const loudGradient = loudCtx.createLinearGradient(0, 0, 1920, 1080);
        loudGradient.addColorStop(0, '#ff4d4d');
        loudGradient.addColorStop(0.5, '#ff6b35');
        loudGradient.addColorStop(1, '#f77737');
        loudCtx.fillStyle = loudGradient;
        loudCtx.fillRect(0, 0, 1920, 1080);
        
        // Add text
        loudCtx.fillStyle = 'rgba(255, 255, 255, 0.3)';
        loudCtx.font = 'bold 200px Arial';
        loudCtx.textAlign = 'center';
        loudCtx.fillText('LOUD', 960, 600);
        
        // Create Quiet.png placeholder
        const quietCanvas = document.getElementById('quietCanvas');
        const quietCtx = quietCanvas.getContext('2d');
        const quietGradient = quietCtx.createLinearGradient(0, 0, 1920, 1080);
        quietGradient.addColorStop(0, '#00d4ff');
        quietGradient.addColorStop(0.5, '#0095ff');
        quietGradient.addColorStop(1, '#0066cc');
        quietCtx.fillStyle = quietGradient;
        quietCtx.fillRect(0, 0, 1920, 1080);
        
        // Add text
        quietCtx.fillStyle = 'rgba(255, 255, 255, 0.3)';
        quietCtx.font = 'bold 200px Arial';
        quietCtx.textAlign = 'center';
        quietCtx.fillText('QUIET', 960, 600);
        
        // Download images
        loudCanvas.toBlob(blob => {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'Loud.png';
            a.click();
        });
        
        quietCanvas.toBlob(blob => {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'Quiet.png';
            a.click();
        });
        
        document.body.innerHTML = '<h1>Placeholder images generated! Check your downloads folder.</h1>';
    </script>
</body>
</html>
